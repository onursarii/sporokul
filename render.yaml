# Render Blueprint: GitHub reposunu bağlayınca API + PostgreSQL otomatik kurulur
databases:
  - name: sporokul-db
    plan: free
    databaseName: sporokul
    user: app
services:
  - type: web
    name: sporokul
    runtime: docker
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: sporokul-db, property: connectionString }
      - key: JWT_SECRET
        generateValue: true
      - key: COACH_SEES_FINANCE
        value: "false"
